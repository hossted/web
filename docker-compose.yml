version: '2'
services:
  web_app:
    build:
      context: . 
      dockerfile: Dockerfile
      args:
        - "HTTP_PROXY=${HTTP_PROXY}"
        - "HTTPS_PROXY=${HTTPS_PROXY}"
        - "NO_PROXY=${NO_PROXY}"
        - "http_proxy=${HTTP_PROXY}"
        - "https_proxy=${HTTPS_PROXY}"
        - "no_proxy=${NO_PROXY}"
    image: "${IMAGE}"
    container_name: "${ORG}-${PROJECT}"
    hostname: "${ORG}-${PROJECT}"
    ports:
     - "${HTTP_PORT}:80"
     - "${HTTPS_PORT}:443"
    volumes:
     - "./src:/var/www/html"
     #- "${FILES_FROM}:${FILES_TO}"
    restart: always
    network_mode: bridge
